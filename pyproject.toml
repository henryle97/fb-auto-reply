[project]
name = "fb-auto-reply"
version = "0.1.0"
description = "Auto-reply to Facebook Page comments with keyword rules and a Claude fallback."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "henryle97" }]
requires-python = ">=3.12"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anthropic>=2.6.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
fb-auto-reply = "fb_auto_reply.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fb_auto_reply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S311"]  # random is fine for reply jitter and template choice

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
